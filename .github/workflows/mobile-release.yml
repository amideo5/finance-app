
name: FinanceApp Mobile Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Choose release version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: financeapp-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # NODE
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # VERSION MANAGEMENT
      # --------------------------------------------------
      - name: Calculate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TYPE="${{ github.event.inputs.release_type }}"

          LATEST_TAG=$(git tag --list \
            --sort=-version:refname \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)

          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION="${LATEST_TAG#v}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "$RELEASE_TYPE" in
            patch)
              PATCH=$((PATCH + 1))
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            *)
              echo "Invalid release type: $RELEASE_TYPE"
              exit 1
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          echo "New version: $NEW_VERSION"
          echo "Android versionCode: $VERSION_CODE"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Update app.json
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os

          path = "app.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          expo = data.setdefault("expo", {})

          expo["version"] = os.environ["NEW_VERSION"]

          android = expo.setdefault("android", {})
          android["versionCode"] = int(os.environ["VERSION_CODE"])

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("Updated app.json")
          PY

      - name: Validate Expo configuration
        run: npx expo config --json

      # --------------------------------------------------
      # EXPO PREBUILD
      # --------------------------------------------------
      - name: Generate native projects
        run: npx expo prebuild --platform all --no-install

      # --------------------------------------------------
      # IOS DEPENDENCIES
      # --------------------------------------------------
      - name: Install iOS dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd ios
          pod install

      # --------------------------------------------------
      # IOS BUILD AND IPA PACKAGING
      # --------------------------------------------------
      - name: Build iOS and package IPA
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 1 \
            -name "*.xcworkspace" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "No iOS workspace found."
            exit 1
          fi

          echo "Workspace: $WORKSPACE"

          xcodebuild -list -workspace "$WORKSPACE"

          WORKSPACE_NAME=$(basename "$WORKSPACE" .xcworkspace)

          SCHEMES=$(xcodebuild -list \
            -workspace "$WORKSPACE" 2>&1)

          echo "$SCHEMES"

          if echo "$SCHEMES" | grep -Eq \
            "^[[:space:]]*${WORKSPACE_NAME}[[:space:]]*$"; then
            APP_SCHEME="$WORKSPACE_NAME"
          else
            echo "Expected app scheme '$WORKSPACE_NAME' was not found."
            echo "Available schemes:"
            echo "$SCHEMES"
            exit 1
          fi

          echo "Building scheme: $APP_SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

          PRODUCTS_DIR="$PWD/build/ios/Build/Products/Release-iphoneos"

          APP_PATH=$(find "$PRODUCTS_DIR" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "Build succeeded but application .app was not found."
            echo "Products directory contents:"
            find "$PRODUCTS_DIR" -maxdepth 4
            exit 1
          fi

          echo "Application found: $APP_PATH"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          rm -f FinanceApp-unsigned.ipa

          zip -r FinanceApp-unsigned.ipa Payload

          rm -rf Payload

          if [ ! -s FinanceApp-unsigned.ipa ]; then
            echo "IPA packaging failed."
            exit 1
          fi

          echo "IPA successfully packaged."

      # --------------------------------------------------
      # ANDROID SIGNING
      # --------------------------------------------------
      - name: Decode Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 -D \
            > android/app/release.keystore

          test -s android/app/release.keystore

          echo "Keystore decoded successfully."

      # --------------------------------------------------
      # PATCH GRADLE SIGNING CONFIG
      # --------------------------------------------------
      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re

          path = "android/app/build.gradle"

          if not os.path.exists(path):
              raise SystemExit(
                  "android/app/build.gradle not found. "
                  "This workflow expects Groovy Gradle."
              )

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          def find_block(text, pattern):
              match = re.search(pattern, text)
              if not match:
                  return None

              opening = text.find("{", match.start())
              if opening < 0:
                  return None

              depth = 0
              for i in range(opening, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return match.start(), opening, i

              return None

          signing_block = find_block(
              content,
              r"\bsigningConfigs\s*\{"
          )

          if not signing_block:
              raise SystemExit("signingConfigs block not found.")

          _, signing_open, signing_close = signing_block

          release_config = """
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          """

          signing_inner = content[signing_open + 1:signing_close]

          release_block = find_block(
              signing_inner,
              r"\brelease\s*\{"
          )

          if release_block:
              start, opening, closing = release_block
              signing_inner = (
                  signing_inner[:start]
                  + release_config
                  + signing_inner[closing + 1:]
              )
          else:
              signing_inner += "\n" + release_config + "\n"

          content = (
              content[:signing_open + 1]
              + signing_inner
              + content[signing_close:]
          )

          build_types_block = find_block(
              content,
              r"\bbuildTypes\s*\{"
          )

          if not build_types_block:
              raise SystemExit("buildTypes block not found.")

          _, build_types_open, build_types_close = build_types_block

          build_types_inner = content[
              build_types_open + 1:build_types_close
          ]

          release_build_block = find_block(
              build_types_inner,
              r"\brelease\s*\{"
          )

          if not release_build_block:
              raise SystemExit("release buildType not found.")

          start, opening, closing = release_build_block

          release_build_inner = build_types_inner[
              opening + 1:closing
          ]

          if re.search(r"\bsigningConfig\s+", release_build_inner):
              release_build_inner = re.sub(
                  r"\bsigningConfig\s+signingConfigs\.\w+",
                  "signingConfig signingConfigs.release",
                  release_build_inner
              )
          else:
              release_build_inner = (
                  "\n"
                  + "signingConfig signingConfigs.release\n"
                  + release_build_inner
              )

          replacement = (
              "release {\n"
              + release_build_inner
              + "\n}"
          )

          build_types_inner = (
              build_types_inner[:start]
              + replacement
              + build_types_inner[closing + 1:]
          )

          content = (
              content[:build_types_open + 1]
              + build_types_inner
              + content[build_types_close:]
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Android release signing configured.")
          PY

      # --------------------------------------------------
      # ANDROID BUILD
      # --------------------------------------------------
      - name: Build Android release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd android

          ./gradlew assembleRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "APK not found: $APK_PATH"
            find android/app/build/outputs -type f
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          cp "$APK_PATH" FinanceApp.apk

          echo "APK successfully verified."

      # --------------------------------------------------
      # CLEAN UP SIGNING KEY
      # --------------------------------------------------
      - name: Remove Android keystore
        if: always()
        shell: bash
        run: |
          rm -f android/app/release.keystore

      # --------------------------------------------------
      # CREATE GITHUB RELEASE
      # --------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FinanceApp v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            FinanceApp.apk
            FinanceApp-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------
      # TRIGGER WEBSITE RELEASE SYNC
      # --------------------------------------------------
      - name: Trigger website release update
        shell: bash
        env:
          WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          curl --fail-with-body \
            --request POST \
            --url https://api.github.com/repos/amideo5/amideo5.github.io/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $WEBSITE_REPO_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"finance-app-release\",\"client_payload\":{\"version\":\"$RELEASE_VERSION\"}}"

          echo "Website release update triggered."

